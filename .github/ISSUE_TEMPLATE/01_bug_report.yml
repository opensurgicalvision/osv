name: Bug Report
description: File a bug or unexpected behavior in code, data loaders, or models.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please do NOT include any real patient Protected Health Information (PHI).
  - type: input
    id: version
    attributes:
      label: OSV Version
      description: What version of open-surgical-vision are you using?
      placeholder: e.g. 0.1.0 or git commit hash
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Code / Steps
      description: Minimal code snippet to reproduce the error.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
