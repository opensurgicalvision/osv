name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check AI Tooling Synchronization (.ai/ -> vendor configs)
        run: |
          python .ai/build.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          pytest tests/
