name: PR Triage & Slop Filter

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  issues: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Issue Linkage (Slop Defense)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const labels = pr.labels.map(l => l.name);

            // Bypass if pre-approved, trivial, or bot PR
            if (labels.includes("pre-approved") || labels.includes("trivial") || pr.user.type === "Bot") {
              console.log("PR is exempt from issue requirement.");
              return;
            }

            // Check for issue reference keywords (Fixes #123, Closes #123, etc.)
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i;
            const match = body.match(issueRegex);

            if (!match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["invalid", "needs-issue-assignment"]
              });

              const comment = `👋 Hi @${pr.user.login}! Thank you for your contribution to OpenSurgicalVision.

              To maintain high research quality and prevent automated/uncoordinated submissions, we enforce an **Issue-First Policy**:
              Every Pull Request must be linked to an existing, assigned Issue (e.g. \`Fixes #123\`).

              👉 **Next steps:**
              1. If an issue already exists for this work, please ensure you were assigned to it and link it in your PR description.
              2. If no issue exists, please open an issue first using one of our templates, discuss it with the maintainers, and request assignment before submitting code.

              *If this is a trivial typo or pre-approved work, a maintainer can apply the \`trivial\` or \`pre-approved\` label to bypass this check.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            } else {
              console.log(`PR successfully references issue #${match[1]}`);
            }
